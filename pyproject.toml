[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "financial-modeling-toolkit"
version = "0.1.0"
description = "Integrated financial forecasts, DCF valuation, and model controls"
requires-python = ">=3.10"
license = {text = "MIT"}
[project.optional-dependencies]
excel = ["openpyxl>=3.1"]
[tool.setuptools.packages.find]
include = ["finmodel*"]
